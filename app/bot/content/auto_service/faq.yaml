- q: "Нужно ли записываться заранее?"
  a: "Не обязательно — без записи принимаем по живой очереди. Но с записью гарантируем подъёмник в нужное время и можем подготовить запчасти заранее."

- q: "Сколько ждать ответа на заявку?"
  a: "В рабочее время — в течение часа. Ночью оператор ответит утром, но если машина не на ходу — позвоните на дежурный +7 (812) 555-12-34."

- q: "Даёте ли гарантию на работы?"
  a: "Да: 6 месяцев на работы, на запчасти — гарантия производителя (от 6 до 36 месяцев в зависимости от детали)."

- q: "Можно ли пригнать свои запчасти?"
  a: "Можно, но на них наша гарантия не распространяется. Рекомендуем согласовать список с мастером заранее."

- q: "Есть ли эвакуатор?"
  a: "Да, работаем с проверенным эвакуатором — заказывайте через нашего менеджера, цена со скидкой клиентам сервиса."

- q: "Можно ли оплатить переводом?"
  a: "Принимаем наличные, карты, СБП и переводы для юр.лиц по счёту."
