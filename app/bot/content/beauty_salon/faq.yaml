- q: "Как записаться?"
  a: "Через бот: «Оставить заявку» → выберите услугу → заполните форму. Администратор подтвердит время в течение 10 минут."

- q: "Можно ли отменить или перенести запись?"
  a: "Да, бесплатно — не позже чем за 4 часа до визита. Откройте «Мои заявки» и нажмите «🚫 Отменить» или напишите администратору."

- q: "Сколько по времени занимает услуга?"
  a: "Стрижка ~1 час, простое окрашивание ~2 часа, сложное ~3-4 часа, маникюр с покрытием ~1.5 часа. Точное время администратор подтвердит при бронировании."

- q: "Какая косметика используется?"
  a: "Только профессиональная: Wella, Estel, Olaplex, OPI. Полный список — у мастеров на месте."

- q: "Есть ли скидки и абонементы?"
  a: "Да: 10% на первое посещение, абонементы на маникюр (5/10/20 визитов) и комплексы «волосы + ногти». Уточните у администратора."

- q: "Принимаете ли вы карты?"
  a: "Да: наличные, карты, СБП, переводы. Чаевые мастеру — отдельным переводом."
