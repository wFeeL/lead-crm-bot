- q: "Как быстро со мной свяжется регистратор?"
  a: "В будние дни — в течение 30 минут. В выходные — до 2 часов. Если случай срочный, позвоните на регистратуру."

- q: "Можно ли отменить запись?"
  a: "Да, не позднее чем за 3 часа до приёма. Откройте «Мои заявки» и нажмите «🚫 Отменить» или сообщите в чат."

- q: "Принимаете ли по ДМС?"
  a: "Работаем с большинством страховых компаний. При записи укажите название страховой — мы проверим лимит и согласуем услугу."

- q: "Можно ли получить результаты анализов в чате?"
  a: "Результаты приходят в личный кабинет на сайте и дублируются по e-mail. По запросу можем выслать PDF в этот бот."

- q: "Есть ли детский приём?"
  a: "Да: педиатры принимают ежедневно с 9 утра. При записи укажите возраст ребёнка — подберём профильного специалиста."

- q: "Безопасны ли мои персональные данные?"
  a: "Данные обрабатываются в соответствии с 152-ФЗ. Доступ — только у регистратора и лечащего врача."
